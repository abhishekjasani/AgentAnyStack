# AgentAnyStack v0 — orchestrator + Ollama
# Chat wiring comes in a later phase; Ollama is ready on the network.

services:
  orchestrator:
    build: .
    image: agent-anystack-orchestrator:v0
    ports:
      - "${PORT:-8787}:8787"
    env_file:
      - path: .env
        required: false
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      OFFICE_REPO_PATH: /office
      OFFICE_UI_PATH: /ui
      PROJECTS_ROOT: /projects
      DATABASE_URL: sqlite:////data/office.db
      # OpenAI-compatible /v1 (Ollama default). Same adapter works for vLLM etc.
      OPENAI_COMPATIBLE_BASE_URL: http://ollama:11434/v1
      # Cold GPU reload + first token can exceed 5m on small VRAM Docker/WSL.
      OPENAI_COMPATIBLE_TIMEOUT: "900"
      # Bedrock desk stack (optional — from host .env)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - ./office:/office
      - ./projects:/projects
      - ./data:/data
    # Ollama optional at boot — chat wiring is a later phase
    restart: unless-stopped

  ollama:
    # Default: CPU. For NVIDIA GPU, also pass docker-compose.gpu.yml (see docs/architecture/07_DOCKER.md).
    image: ollama/ollama:latest
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      # Host-visible weights (gitignored via data/*)
      - ./data/ollama:/root/.ollama
    restart: unless-stopped
