# Optional NVIDIA GPU override for the ollama service.
# Default `docker-compose.yml` ollama profile is CPU-only (always starts).
# Ollama uses the GPU when devices are passed in; without this file it stays on CPU.
#
# Usage (Windows PowerShell / bash):
#   docker compose --profile ollama -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Prereqs: NVIDIA driver + Docker GPU support (Windows: Docker Desktop + WSL2 + NVIDIA Container Toolkit).
# If this fails to start (no GPU / no toolkit), drop the gpu file and use CPU:
#   docker compose --profile ollama up -d

services:
  # nvidia-smi in orchestrator enables Stacks GET /models/health without docker.sock
  orchestrator:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OLLAMA_CONTAINER_NAME: agentanystack-ollama-1

  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Avoid dual CUDA+Vulkan discovery hangs (falls back to CPU with vram=0).
      OLLAMA_VULKAN: "false"
      # Probe one CUDA stack — RTX 40/50-class / Ada laptop often needs v13.
      OLLAMA_LLM_LIBRARY: cuda_v13
      # First CUDA load on small VRAM can exceed the 5m default.
      OLLAMA_LOAD_TIMEOUT: 15m
      # Keep model in VRAM between prompts (default 5m looks like a "GPU flush").
      OLLAMA_KEEP_ALIVE: 30m
      # Cap runner default context (model GGUF may advertise 128k).
      # App no longer sends per-request options.num_ctx — this is the KV size.
      OLLAMA_CONTEXT_LENGTH: "2048"
      # Device-memory fitter can hang for minutes on small VRAM + Docker/WSL CUDA
      # (GPU stays ~0% / ~70MiB while "fitting params" / load_tensors).
      LLAMA_ARG_FIT: "off"
