id: gold.append
kind: internal_tool
name: Append Gold Note
description: Append one durable working note (decision, open thread, preference). Do not dump the whole chat. Orchestrator assigns a unique id.
handler: gold.append
tool_name: append_gold
parameters:
  type: object
  properties:
    text:
      type: string
      description: One durable bullet to remember.
  required:
    - text
  additionalProperties: false
default_inherit: true
approval_mode: never
risk_class: read_draft
tags:
  - gold
