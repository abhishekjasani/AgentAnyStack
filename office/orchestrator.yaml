# Office front desk / soft orchestrator jobs — NOT a desk persona.
# Team shows a pinned "Office" card; Configure edits this file.
# Desk agents: office/teams/<team>/agents/<id>/agent.yaml
#
# Soft jobs using `model`:
#   - OKF post-run extract (when okf_extract_enabled)
#   - Office Q&A phrasing (when office_qa_llm)
#
# Stack envelope (Ollama cold-start):
#   - default_num_ctx — fallback when curated catalog has no per-tag num_ctx
#   - default_max_input_tokens (-1 = derive from num_ctx - max_output)
#   - default_max_output_tokens (-1 = omit max_tokens on the wire)
# Agent desks may tighten max_input_tokens / max_output_tokens only (-1 inherit).
#
# TODO: extract_temperature / soft-job sampling policy (ORCHESTRATOR.md §5)
# TODO: office_qa_phrase_style (short | formal)
# TODO: default_project_id for memory pack when projects ship
# TODO: extract_schema_version
# TODO: Stacks helper restart_ollama_on_flush (container recreate)

id: office
name: Office
model: llama3.2
office_qa_llm: false
okf_extract_enabled: true
pack_token_budget: 8000
gold_max_chars: 64000
recent_history_days: 7
recent_history_char_budget: 6000
approver_mode: permissive
default_num_ctx: 2048
default_max_input_tokens: -1
default_max_output_tokens: 1024
