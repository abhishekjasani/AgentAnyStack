[project]
name = "agent-anystack"
version = "0.2.2"
description = "AgentAnyStack orchestrator — office backbone for agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_anystack"]

# Map src/ layout so import is agent_anystack, not src.agent_anystack
[tool.hatch.build.targets.wheel.sources]
"src/agent_anystack" = "agent_anystack"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
